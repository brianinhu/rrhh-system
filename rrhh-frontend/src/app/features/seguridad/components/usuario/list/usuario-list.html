<table mat-table [dataSource]="usuarios()">

    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.nombreCompleto}} </td>
    </ng-container>

    <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef> Roles </th>
        <td mat-cell *matCellDef="let element">
            <mat-chip-set>
                @for (rol of element.nombresRoles; track rol) {
                <mat-chip>{{ rol }}</mat-chip>
                } @empty {
                <span>Sin roles</span>
                }
            </mat-chip-set>
        </td>
    </ng-container>

    <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let element">
            @if (element.enabled) {
            <mat-chip color="primary" selected>Activo</mat-chip>
            } @else {
            <mat-chip color="warn" selected>Inactivo</mat-chip>
            }
        </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="editar(element)">
                <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button (click)="toggleEstado(element)">
                <mat-icon [color]="element.enabled ? 'warn' : 'primary'">
                    {{ element.enabled ? 'block' : 'check_circle' }}
                </mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            No hay usuarios registrados.
        </td>
    </tr>
</table>
