services:
  postgres-server:
    image: postgres:16
    container_name: postgres-server
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      DB_NAME_CORE: ${DB_NAME_CORE:-rrhh_core_db}
      DB_NAME_IAM: ${DB_NAME_IAM:-rrhh_iam_db}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - rrhh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: keycloak
    command: 
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-postgres-server}:5432/${DB_NAME_IAM:-rrhh_iam_db}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KC_HOSTNAME_URL: ${KEYCLOAK_URL:-http://localhost:8180}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./rrhh-core-realm.json:/opt/keycloak/data/import/realm.json
    depends_on:
      postgres-server:
        condition: service_healthy
    networks:
      - rrhh-network
  
  rrhh-backend:
    build:
      context: ./rrhh-backend
      dockerfile: Dockerfile
    container_name: rrhh-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-postgres-server}:5432/${DB_NAME_CORE:-rrhh_core_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KEYCLOAK_URL:-http://localhost:8180}/auth/realms/${KEYCLOAK_REALM:-rrhh-core}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:-rrhh-core}/protocol/openid-connect/certs
      # Explicitly injection 
      - FRONTEND_URL=${FRONTEND_URL}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_ADMIN_REALM=master
      - KEYCLOAK_ADMIN_CLIENT_ID=admin-cli
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      postgres-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - rrhh-network

  rrhh-frontend:
    build:
      context: ./rrhh-frontend
      dockerfile: Dockerfile
      args:
        - BUILD_CONFIG=demo
    container_name: rrhh-frontend
    ports:
      - "4200:80"
    depends_on:
      - rrhh-backend
    networks:
      - rrhh-network

networks:
  rrhh-network:
    driver: bridge
